[package]
name = "kobold-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Benchmark harness for the gnucobol-rs hot path (cob_move COMP-3 <-> display) and kobold-data-shim record decode, with a parity re-check after every run. Performance never alters sealed semantics."
license = "Apache-2.0"
authors = ["infinityabundance"]
repository = "https://github.com/infinityabundance/kobold-bench"
readme = "README.md"
keywords = ["cobol", "benchmark", "packed-decimal", "comp-3", "mainframe"]
categories = ["development-tools::profiling", "command-line-utilities"]

[dependencies]
gnucobol-rs = { version = "0.7", path = "../gnucobol-rs/crates/gnucobol-rs" }
kobold-data-shim = { version = "0.6", path = "../kobold-data-shim" }
rayon = { version = "1", optional = true }
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "kobold-throughput"
path = "src/main.rs"

[[bin]]
name = "kobold-bench2"
path = "src/bin/bench2.rs"

[[bin]]
name = "kobold-scale"
path = "src/bin/scale.rs"

[[bench]]
name = "cob_move"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

[features]
rayon = ["dep:rayon", "kobold-data-shim/rayon"]
