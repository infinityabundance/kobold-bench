[package]
name = "kobold-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Benchmark harness for the gnucobol-rs hot path (cob_move COMP-3 <-> display) and kobold-data-shim record decode, with a parity re-check after every run. Performance never alters sealed semantics."
license = "Apache-2.0"
authors = ["infinityabundance"]
repository = "https://github.com/infinityabundance/kobold-bench"
readme = "README.md"
publish = false

[dependencies]
gnucobol-rs = "0.2.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "kobold-throughput"
path = "src/main.rs"

[[bench]]
name = "cob_move"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
